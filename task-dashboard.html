<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поручения — панель руководителя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1A2233;
    --ink-soft: #5B6478;
    --sidebar-bg: #131A2A;
    --sidebar-text: #B9C2D6;
    --sidebar-text-active: #FFFFFF;
    --paper: #F3F4F7;
    --card: #FFFFFF;
    --line: #E1E4EA;
    --accent: #2F5D50;
    --accent-soft: #DCE8E3;
    --accent-strong: #1F4238;
    --warn: #B5601C;
    --warn-soft: #F5E4D2;
    --red: #A6332B;
    --red-soft: #F3DEDB;
    --shadow: rgba(26, 34, 51, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #E7E9EF;
      --ink-soft: #9AA3B8;
      --sidebar-bg: #0C111C;
      --sidebar-text: #99A3BA;
      --sidebar-text-active: #FFFFFF;
      --paper: #171C29;
      --card: #1F2635;
      --line: #303A4F;
      --accent: #4C9481;
      --accent-soft: #223A34;
      --accent-strong: #6FB6A3;
      --warn: #D89552;
      --warn-soft: #3B2C1C;
      --red: #D97A72;
      --red-soft: #3A2321;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --ink: #E7E9EF; --ink-soft: #9AA3B8; --sidebar-bg: #0C111C; --sidebar-text: #99A3BA;
    --sidebar-text-active: #FFFFFF; --paper: #171C29; --card: #1F2635; --line: #303A4F;
    --accent: #4C9481; --accent-soft: #223A34; --accent-strong: #6FB6A3;
    --warn: #D89552; --warn-soft: #3B2C1C; --red: #D97A72; --red-soft: #3A2321;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; min-height: 100vh; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
  h1, h2, h3 { font-family: 'Spectral', serif; margin: 0; }
  button { font-family: inherit; }
  a { color: var(--accent-strong); }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent-strong); outline-offset: 2px;
  }

  /* ---------- Login ---------- */
  .login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 2px 10px var(--shadow);
  }
  .login-box h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .login-box .sub { color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 20px; }
  .role-tabs { display: flex; gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 3px; margin-bottom: 20px; }
  .role-tabs button {
    flex: 1; padding: 8px; border: none; background: transparent; border-radius: 4px; cursor: pointer;
    color: var(--ink-soft); font-size: 0.85rem; font-weight: 600;
  }
  .role-tabs button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--paper); color: var(--ink); font-size: 0.92rem; font-family: inherit;
  }
  .primary-btn {
    width: 100%; padding: 10px; border: none; border-radius: 4px; background: var(--accent);
    color: #fff; font-weight: 700; font-size: 0.92rem; cursor: pointer; margin-top: 6px;
  }
  .primary-btn:hover { background: var(--accent-strong); }
  .login-error { color: var(--red); font-size: 0.82rem; margin-top: 8px; min-height: 1em; }
  .hint-note { font-size: 0.76rem; color: var(--ink-soft); margin-top: 16px; line-height: 1.5; border-top: 1px solid var(--line); padding-top: 12px; }

  /* ---------- App shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; flex-shrink: 0; background: var(--sidebar-bg); color: var(--sidebar-text);
    display: flex; flex-direction: column; padding: 20px 0;
  }
  .sidebar .brand { font-family: 'Spectral', serif; font-size: 1.05rem; color: #fff; padding: 0 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .sidebar nav button {
    text-align: left; background: transparent; border: none; border-left: 3px solid transparent;
    color: var(--sidebar-text); padding: 11px 18px; font-size: 0.9rem; cursor: pointer;
  }
  .sidebar nav button:hover { color: #fff; }
  .sidebar nav button.active { color: var(--sidebar-text-active); border-left-color: var(--accent-strong); background: rgba(255,255,255,0.04); font-weight: 600; }
  .sidebar .who { padding: 14px 20px 0; font-size: 0.78rem; color: var(--sidebar-text); border-top: 1px solid rgba(255,255,255,0.08); margin-top: 8px; padding-top: 14px; }
  .sidebar .who strong { color: #fff; display: block; font-size: 0.86rem; margin-bottom: 6px; }
  .sidebar .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.18); color: var(--sidebar-text); border-radius: 4px; padding: 6px 10px; font-size: 0.78rem; cursor: pointer; margin-top: 8px; }
  .sidebar .logout-btn:hover { color: #fff; border-color: #fff; }

  .main { flex: 1; padding: 28px 32px 60px; max-width: 1100px; }
  .page-head { margin-bottom: 22px; }
  .page-head h1 { font-size: 1.5rem; }
  .page-head p { color: var(--ink-soft); font-size: 0.88rem; margin-top: 4px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 3px var(--shadow); }
  .card h2 { font-size: 1.02rem; margin-bottom: 12px; }

  /* input row */
  .input-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .input-row .grow { flex: 1; min-width: 240px; }
  .input-row label { display: block; font-size: 0.76rem; color: var(--ink-soft); margin-bottom: 5px; }
  .input-row input[type=text], .input-row input[type=date] {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--paper); color: var(--ink); font-size: 0.9rem; font-family: inherit;
  }
  .input-row .add-btn {
    padding: 9px 16px; border: none; border-radius: 4px; background: var(--accent); color: #fff;
    font-weight: 700; font-size: 0.86rem; cursor: pointer; white-space: nowrap;
  }
  .input-row .add-btn:hover { background: var(--accent-strong); }
  .match-note { font-size: 0.8rem; margin-top: 8px; }
  .match-note.found { color: var(--accent-strong); }
  .match-note.missing { color: var(--warn); }
  .manual-pick { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .manual-pick select { padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); font-size: 0.85rem; }

  /* notifications */
  .notif-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .notif-item:last-child { border-bottom: none; }
  .notif-item .who { font-weight: 600; font-size: 0.9rem; }
  .notif-item .task { color: var(--ink-soft); font-size: 0.84rem; }
  .wa-btn {
    background: var(--accent-soft); color: var(--accent-strong); border: none; border-radius: 4px;
    padding: 7px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .wa-btn:hover { background: var(--accent); color: #fff; }
  .wa-btn.sent { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); cursor: default; }
  .empty-line { color: var(--ink-soft); font-size: 0.85rem; }

  /* calendar */
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .cal-nav button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 3px; width: 30px; height: 30px; cursor: pointer; }
  .cal-nav button:hover { border-color: var(--accent); color: var(--accent-strong); }
  .cal-nav .label { font-family: 'Spectral', serif; font-weight: 600; min-width: 170px; text-align: center; }
  .weekday-row, .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weekday-row span { text-align: center; font-size: 0.7rem; color: var(--ink-soft); padding-bottom: 4px; display: block; }
  .day-cell {
    position: relative; aspect-ratio: 1/0.8; border: 1px solid transparent; border-radius: 3px;
    background: var(--paper); color: var(--ink); font-size: 0.88rem; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .day-cell:hover { border-color: var(--accent); }
  .day-cell.is-muted { opacity: 0.35; cursor: default; }
  .day-cell.is-muted:hover { border-color: transparent; }
  .day-cell.is-red { color: var(--red); background: var(--red-soft); }
  .day-cell.is-today { outline: 2px solid var(--accent-strong); outline-offset: -2px; font-weight: 700; }
  .day-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0; }
  .day-cell.has-task .day-dot { opacity: 1; }
  .cal-legend { display: flex; gap: 16px; margin-top: 12px; font-size: 0.78rem; color: var(--ink-soft); flex-wrap: wrap; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .day-detail { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .day-detail h3 { font-size: 0.92rem; margin-bottom: 8px; }

  /* employees grid */
  .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .emp-card {
    border: 1px solid var(--line); border-radius: 5px; padding: 14px; background: var(--paper);
    cursor: pointer; text-align: left;
  }
  .emp-card:hover { border-color: var(--accent); }
  .emp-card .name { font-weight: 700; font-size: 0.92rem; margin-bottom: 3px; }
  .emp-card .role { color: var(--ink-soft); font-size: 0.8rem; margin-bottom: 8px; }
  .emp-card .count { font-size: 0.78rem; color: var(--accent-strong); font-weight: 600; }

  /* task list */
  .task-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  .task-table th { text-align: left; color: var(--ink-soft); font-weight: 600; font-size: 0.76rem; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .task-table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .task-table tr:last-child td { border-bottom: none; }
  .status-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.74rem; font-weight: 600; }
  .status-pill.active { background: var(--warn-soft); color: var(--warn); }
  .status-pill.done { background: var(--accent-soft); color: var(--accent-strong); }
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { border: 1px solid var(--line); background: transparent; color: var(--ink-soft); border-radius: 3px; padding: 4px 8px; font-size: 0.74rem; cursor: pointer; }
  .row-actions button:hover { border-color: var(--accent); color: var(--accent-strong); }

  /* forms */
  .emp-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .emp-form .field label { display: block; font-size: 0.76rem; color: var(--ink-soft); margin-bottom: 5px; }
  .emp-form .field input { width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); color: var(--ink); font-size: 0.86rem; font-family: inherit; }

  /* modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10, 14, 22, 0.5); display: flex; align-items: center;
    justify-content: center; padding: 20px; z-index: 50;
  }
  .modal {
    background: var(--card); border-radius: 6px; max-width: 560px; width: 100%; max-height: 85vh;
    overflow-y: auto; padding: 24px; border: 1px solid var(--line);
  }
  .modal-close { float: right; border: none; background: transparent; color: var(--ink-soft); font-size: 1.2rem; cursor: pointer; }
  .modal h2 { font-size: 1.15rem; margin-bottom: 2px; }
  .modal .modal-sub { color: var(--ink-soft); font-size: 0.84rem; margin-bottom: 16px; }
  .modal-phone { font-size: 0.86rem; margin-bottom: 4px; }

  /* employee self view */
  .self-card { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .avatar-badge {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center; font-family: 'Spectral', serif; font-size: 1.3rem; font-weight: 700; flex-shrink: 0;
  }

  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 5px; font-size: 0.84rem; box-shadow: 0 2px 10px var(--shadow); z-index: 80; }

  .storage-banner { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); border-radius: 5px; padding: 10px 14px; font-size: 0.8rem; margin-bottom: 18px; }

  @media (max-width: 760px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; align-items: center; padding: 10px 14px; overflow-x: auto; }
    .sidebar .brand { display: none; }
    .sidebar nav { flex-direction: row; }
    .sidebar .who { display: none; }
    .main { padding: 18px 16px 50px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  const LS_KEY = 'wa-dashboard-data-v1';
  const ADMIN_LOGIN = 'admin';
  const ADMIN_PASS = 'admin';
  const HOLIDAYS_MMDD = ['01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08','02-23','03-08','05-01','05-09','06-12','11-04'];
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  let db = null;
  let employees = [];
  let tasks = [];
  let storageMode = 'checking'; // 'db' | 'local'

  // ---------- session ----------
  let session = null;
  try { session = JSON.parse(sessionStorage.getItem('wa-dash-session') || 'null'); } catch (e) { session = null; }

  function setSession(s) {
    session = s;
    try { sessionStorage.setItem('wa-dash-session', JSON.stringify(s)); } catch (e) {}
    render();
  }
  function logout() {
    session = null;
    try { sessionStorage.removeItem('wa-dash-session'); } catch (e) {}
    render();
  }

  // ---------- local fallback store ----------
  const listeners = { employees: [], tasks: [] };
  function loadLocal() {
    try {
      const raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      employees = raw.employees || [];
      tasks = raw.tasks || [];
    } catch (e) { employees = []; tasks = []; }
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ employees, tasks })); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  const Store = {
    async addEmployee(data) {
      if (storageMode === 'db') { await db.collection('employees').add(data); }
      else { employees.push({ id: uid(), ...data }); saveLocal(); notifyLocal(); }
    },
    async updateEmployee(id, data) {
      if (storageMode === 'db') { await db.doc('employees/' + id).update(data); }
      else { const e = employees.find(x => x.id === id); if (e) Object.assign(e, data); saveLocal(); notifyLocal(); }
    },
    async deleteEmployee(id) {
      if (storageMode === 'db') { await db.doc('employees/' + id).delete(); }
      else { employees = employees.filter(x => x.id !== id); saveLocal(); notifyLocal(); }
    },
    async addTask(data) {
      if (storageMode === 'db') { await db.collection('tasks').add(data); }
      else { tasks.push({ id: uid(), ...data }); saveLocal(); notifyLocal(); }
    },
    async updateTask(id, data) {
      if (storageMode === 'db') { await db.doc('tasks/' + id).update(data); }
      else { const t = tasks.find(x => x.id === id); if (t) Object.assign(t, data); saveLocal(); notifyLocal(); }
    },
    async deleteTask(id) {
      if (storageMode === 'db') { await db.doc('tasks/' + id).delete(); }
      else { tasks = tasks.filter(x => x.id !== id); saveLocal(); notifyLocal(); }
    }
  };

  function notifyLocal() { render(); }

  // ---------- init ----------
  async function init() {
    try {
      db = await claude.use('db');
    } catch (e) { db = null; }

    if (db) {
      storageMode = 'db';
      db.collection('employees').orderBy('fio').onSnapshot(
        snap => { employees = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
        () => {}
      );
      db.collection('tasks').orderBy('dueDate').onSnapshot(
        snap => { tasks = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
        () => {}
      );
    } else {
      storageMode = 'local';
      loadLocal();
    }
    render();
  }

  // fall back to local mode if db never resolves shortly after load, so the
  // page is usable immediately rather than blank
  setTimeout(() => { if (storageMode === 'checking') { storageMode = 'local'; loadLocal(); render(); } }, 1200);

  // ---------- helpers ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function isoDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function todayIso() { return isoDate(new Date()); }
  function surnameOf(fio) { return (fio || '').trim().split(/\s+/)[0] || ''; }
  function digitsOf(phone) { return (phone || '').replace(/\D/g, ''); }
  function waLink(phone, text) { return `https://wa.me/${digitsOf(phone)}?text=${encodeURIComponent(text)}`; }
  function isRed(d) {
    const dow = d.getDay();
    const mmdd = `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    return dow === 0 || HOLIDAYS_MMDD.includes(mmdd);
  }
  function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function findEmployeeMatch(text) {
    const lower = (text || '').toLowerCase();
    for (const emp of employees) {
      const sn = surnameOf(emp.fio).toLowerCase();
      if (!sn) continue;
      const re = new RegExp('(^|[^а-яёa-z])' + sn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^а-яёa-z]|$)', 'i');
      if (re.test(lower)) return emp;
    }
    return null;
  }

  // ---------- render root ----------
  const root = document.getElementById('app');

  function render() {
    if (!session) { renderLogin(); return; }
    if (session.role === 'admin') { renderAdmin(); return; }
    if (session.role === 'employee') { renderEmployeeSelf(); return; }
    renderLogin();
  }

  // ---------- LOGIN ----------
  let loginRole = 'admin';
  function renderLogin() {
    root.innerHTML = `
      <div class="login-screen">
        <div class="login-box">
          <h1>Поручения</h1>
          <p class="sub">Панель постановки задач сотрудникам</p>
          <div class="role-tabs">
            <button id="tabAdmin" class="${loginRole === 'admin' ? 'active' : ''}">Руководитель</button>
            <button id="tabEmp" class="${loginRole === 'employee' ? 'active' : ''}">Сотрудник</button>
          </div>
          <div id="loginBody"></div>
          <div class="hint-note">Вход для руководителя: логин <strong>admin</strong>, пароль <strong>admin</strong>. Это демонстрационный доступ, не рассчитанный на промышленную защиту данных.</div>
        </div>
      </div>
    `;
    document.getElementById('tabAdmin').onclick = () => { loginRole = 'admin'; renderLogin(); };
    document.getElementById('tabEmp').onclick = () => { loginRole = 'employee'; renderLogin(); };
    const body = document.getElementById('loginBody');
    if (loginRole === 'admin') {
      body.innerHTML = `
        <div class="field"><label>Логин</label><input type="text" id="loginUser"></div>
        <div class="field"><label>Пароль</label><input type="password" id="loginPass"></div>
        <button class="primary-btn" id="doLogin">Войти</button>
        <div class="login-error" id="loginErr"></div>
      `;
      document.getElementById('doLogin').onclick = () => {
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value;
        if (u === ADMIN_LOGIN && p === ADMIN_PASS) { setSession({ role: 'admin' }); }
        else { document.getElementById('loginErr').textContent = 'Неверный логин или пароль'; }
      };
    } else {
      const options = employees.map(e => `<option value="${e.id}">${escapeHtml(e.fio)}</option>`).join('');
      body.innerHTML = `
        <div class="field"><label>Выберите себя из списка</label>
          <select id="empSelect">${options || '<option disabled selected>Список сотрудников пуст</option>'}</select>
        </div>
        <button class="primary-btn" id="doEmpLogin" ${employees.length ? '' : 'disabled'}>Открыть мой кабинет</button>
      `;
      const btn = document.getElementById('doEmpLogin');
      if (btn) btn.onclick = () => {
        const id = document.getElementById('empSelect').value;
        setSession({ role: 'employee', employeeId: id });
      };
    }
  }

  // ---------- ADMIN ----------
  let adminTab = 'tasks';
  let taskInputValue = '';
  let taskDateValue = todayIso();
  let manualEmployeeId = '';
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let selectedDay = null;
  let modalEmpId = null;
  let editingEmpId = null;

  function renderAdmin() {
    root.innerHTML = `
      <div class="shell">
        <aside class="sidebar">
          <div class="brand">Поручения</div>
          <nav>
            <button id="navTasks" class="${adminTab === 'tasks' ? 'active' : ''}">Поручения</button>
            <button id="navEmp" class="${adminTab === 'employees' ? 'active' : ''}">Сотрудники</button>
          </nav>
          <div class="who"><strong>Руководитель</strong>вход: admin</div>
          <button class="logout-btn" id="logoutBtn">Выйти</button>
        </aside>
        <main class="main" id="mainArea"></main>
      </div>
    `;
    document.getElementById('navTasks').onclick = () => { adminTab = 'tasks'; renderAdmin(); };
    document.getElementById('navEmp').onclick = () => { adminTab = 'employees'; renderAdmin(); };
    document.getElementById('logoutBtn').onclick = logout;

    const main = document.getElementById('mainArea');
    if (storageMode === 'local') {
      main.innerHTML = '<div class="storage-banner">Общее хранилище недоступно в этом окне — данные сохраняются только в этом браузере и не видны другим участникам.</div>';
    }
    if (adminTab === 'tasks') renderTasksTab(main); else renderEmployeesTab(main);
    if (modalEmpId) renderEmployeeModal();
  }

  function renderTasksTab(main) {
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="page-head">
        <h1>Поручения</h1>
        <p>Впишите задание и фамилию исполнителя одной строкой — сотрудник определится автоматически.</p>
      </div>

      <div class="card">
        <h2>Новое поручение</h2>
        <div class="input-row">
          <div class="grow">
            <label>Задание и фамилия исполнителя</label>
            <input type="text" id="taskInput" placeholder="Напр.: Иванову подготовить отчёт по складу" value="${escapeHtml(taskInputValue)}">
          </div>
          <div>
            <label>Срок (день выполнения)</label>
            <input type="date" id="taskDate" value="${taskDateValue}">
          </div>
          <button class="add-btn" id="addTaskBtn">Добавить</button>
        </div>
        <div id="matchArea"></div>
      </div>

      <div class="card">
        <h2>Напоминания на сегодня</h2>
        <div id="notifArea"></div>
      </div>

      <div class="card">
        <h2>Календарь</h2>
        <div id="calArea"></div>
      </div>

      <div class="card">
        <h2>Сотрудники и их поручения</h2>
        <div class="emp-grid" id="empSummaryGrid"></div>
      </div>
    `;
    main.appendChild(wrap);

    const input = document.getElementById('taskInput');
    input.oninput = () => { taskInputValue = input.value; updateMatchArea(); };
    document.getElementById('taskDate').onchange = (e) => { taskDateValue = e.target.value; };
    document.getElementById('addTaskBtn').onclick = handleAddTask;
    updateMatchArea();
    renderNotifArea();
    renderCalendarArea();
    renderEmpSummary();
  }

  function updateMatchArea() {
    const area = document.getElementById('matchArea');
    if (!area) return;
    if (!taskInputValue.trim()) { area.innerHTML = ''; return; }
    const match = findEmployeeMatch(taskInputValue);
    if (match) {
      area.innerHTML = `<div class="match-note found">Исполнитель распознан: ${escapeHtml(match.fio)}</div>`;
      manualEmployeeId = match.id;
    } else if (employees.length) {
      const options = employees.map(e => `<option value="${e.id}">${escapeHtml(e.fio)}</option>`).join('');
      area.innerHTML = `
        <div class="match-note missing">Фамилия не распознана в тексте — выберите сотрудника вручную:</div>
        <div class="manual-pick"><select id="manualEmpSelect"><option value="">— выбрать —</option>${options}</select></div>
      `;
      document.getElementById('manualEmpSelect').onchange = (e) => { manualEmployeeId = e.target.value; };
    } else {
      area.innerHTML = `<div class="match-note missing">Список сотрудников пуст — сначала добавьте сотрудника на вкладке «Сотрудники».</div>`;
      manualEmployeeId = '';
    }
  }

  async function handleAddTask() {
    const text = taskInputValue.trim();
    if (!text) return;
    let emp = findEmployeeMatch(text);
    if (!emp && manualEmployeeId) emp = employees.find(e => e.id === manualEmployeeId);
    if (!emp) { showToast('Не выбран исполнитель'); return; }
    if (!taskDateValue) { showToast('Укажите срок'); return; }
    await Store.addTask({
      employeeId: emp.id,
      employeeFio: emp.fio,
      text,
      dueDate: taskDateValue,
      status: 'active',
      notified: false,
      createdAt: todayIso()
    });
    taskInputValue = '';
    taskDateValue = todayIso();
    manualEmployeeId = '';
    showToast('Поручение добавлено');
    renderAdmin();
  }

  function renderNotifArea() {
    const area = document.getElementById('notifArea');
    if (!area) return;
    const today = todayIso();
    const due = tasks.filter(t => t.dueDate === today && t.status !== 'done');
    if (!due.length) { area.innerHTML = '<p class="empty-line">Сегодня напоминать некому.</p>'; return; }
    area.innerHTML = due.map(t => {
      const emp = employees.find(e => e.id === t.employeeId);
      const phone = emp ? emp.phone : '';
      const msg = `Добрый день, ${emp ? emp.fio : ''}. Напоминаем: сегодня срок выполнения поручения — «${t.text}».`;
      return `
        <div class="notif-item">
          <div>
            <div class="who">${escapeHtml(emp ? emp.fio : 'Сотрудник удалён')}</div>
            <div class="task">${escapeHtml(t.text)}</div>
          </div>
          ${phone
            ? `<a class="wa-btn ${t.notified ? 'sent' : ''}" href="${waLink(phone, msg)}" target="_blank" rel="noopener" data-task="${t.id}">${t.notified ? 'Отправлено' : 'Отправить в WhatsApp'}</a>`
            : `<span class="empty-line">нет номера</span>`}
        </div>
      `;
    }).join('');
    area.querySelectorAll('.wa-btn[data-task]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-task');
        await Store.updateTask(id, { notified: true });
      });
    });
  }

  function renderCalendarArea() {
    const area = document.getElementById('calArea');
    if (!area) return;
    area.innerHTML = `
      <div class="cal-nav">
        <button id="calPrev" aria-label="Предыдущий месяц">‹</button>
        <div class="label">${monthNames[calMonth]} ${calYear}</div>
        <button id="calNext" aria-label="Следующий месяц">›</button>
      </div>
      <div class="weekday-row"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
      <div class="day-grid" id="dayGrid"></div>
      <div class="cal-legend">
        <span><span class="legend-swatch" style="background:var(--red-soft);border:1px solid var(--red);"></span>красная дата</span>
        <span><span class="legend-swatch" style="background:var(--accent);"></span>есть поручение</span>
      </div>
      <div id="dayDetail" class="day-detail" style="display:none;"></div>
    `;
    document.getElementById('calPrev').onclick = () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendarArea(); };
    document.getElementById('calNext').onclick = () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendarArea(); };

    const grid = document.getElementById('dayGrid');
    const first = new Date(calYear, calMonth, 1);
    let offset = first.getDay() - 1; if (offset < 0) offset = 6;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const daysInPrev = new Date(calYear, calMonth, 0).getDate();
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push({ day: daysInPrev - offset + 1 + i, muted: true, prev: true });
    for (let d = 1; d <= daysInMonth; d++) cells.push({ day: d, muted: false });
    const rem = cells.length % 7;
    if (rem) for (let d = 1; d <= 7 - rem; d++) cells.push({ day: d, muted: true, next: true });

    const todayStr = todayIso();
    cells.forEach(cell => {
      let y = calYear, m = calMonth;
      if (cell.prev) { m = calMonth - 1; if (m < 0) { m = 11; y--; } }
      if (cell.next) { m = calMonth + 1; if (m > 11) { m = 0; y++; } }
      const dateObj = new Date(y, m, cell.day);
      const iso = isoDate(dateObj);
      const btn = document.createElement('button');
      btn.className = 'day-cell';
      if (cell.muted) btn.classList.add('is-muted');
      if (isRed(dateObj)) btn.classList.add('is-red');
      if (iso === todayStr) btn.classList.add('is-today');
      const hasTask = tasks.some(t => t.dueDate === iso);
      if (hasTask) btn.classList.add('has-task');
      btn.innerHTML = `<span>${cell.day}</span><span class="day-dot"></span>`;
      if (!cell.muted) btn.onclick = () => { selectedDay = iso; renderDayDetail(); };
      grid.appendChild(btn);
    });

    if (selectedDay) renderDayDetail();
  }

  function renderDayDetail() {
    const box = document.getElementById('dayDetail');
    if (!box || !selectedDay) return;
    box.style.display = 'block';
    const dayTasks = tasks.filter(t => t.dueDate === selectedDay);
    const [y, m, d] = selectedDay.split('-').map(Number);
    box.innerHTML = `<h3>${d} ${monthNames[m - 1].toLowerCase()} ${y}</h3>` + (
      dayTasks.length
        ? dayTasks.map(t => `<div class="notif-item"><div><div class="who">${escapeHtml(t.employeeFio)}</div><div class="task">${escapeHtml(t.text)}</div></div><span class="status-pill ${t.status}">${t.status === 'done' ? 'выполнено' : 'в работе'}</span></div>`).join('')
        : '<p class="empty-line">На этот день поручений нет.</p>'
    );
  }

  function renderEmpSummary() {
    const grid = document.getElementById('empSummaryGrid');
    if (!grid) return;
    if (!employees.length) { grid.innerHTML = '<p class="empty-line">Сотрудники ещё не добавлены.</p>'; return; }
    grid.innerHTML = employees.map(e => {
      const own = tasks.filter(t => t.employeeId === e.id);
      const active = own.filter(t => t.status !== 'done').length;
      return `
        <button class="emp-card" data-emp="${e.id}">
          <div class="name">${escapeHtml(e.fio)}</div>
          <div class="role">${escapeHtml(e.position || 'без должности')}</div>
          <div class="count">${active} активных · ${own.length} всего</div>
        </button>
      `;
    }).join('');
    grid.querySelectorAll('.emp-card').forEach(c => c.onclick = () => { modalEmpId = c.getAttribute('data-emp'); renderAdmin(); });
  }

  // ---------- Employees tab (admin's cabinet) ----------
  function renderEmployeesTab(main) {
    const wrap = document.createElement('div');
    const editing = editingEmpId ? employees.find(e => e.id === editingEmpId) : null;
    wrap.innerHTML = `
      <div class="page-head">
        <h1>Сотрудники</h1>
        <p>Личный кабинет администратора: добавляйте, редактируйте и удаляйте сотрудников.</p>
      </div>
      <div class="card">
        <h2>${editing ? 'Изменить сотрудника' : 'Добавить сотрудника'}</h2>
        <div class="emp-form">
          <div class="field"><label>ФИО</label><input type="text" id="fFio" placeholder="Иванов Иван Иванович" value="${editing ? escapeHtml(editing.fio) : ''}"></div>
          <div class="field"><label>Должность</label><input type="text" id="fPos" placeholder="Менеджер склада" value="${editing ? escapeHtml(editing.position || '') : ''}"></div>
          <div class="field"><label>Телефон (WhatsApp)</label><input type="text" id="fPhone" placeholder="+7 900 000-00-00" value="${editing ? escapeHtml(editing.phone || '') : ''}"></div>
          <div class="field"><label>Заметка</label><input type="text" id="fNote" placeholder="необязательно" value="${editing ? escapeHtml(editing.notes || '') : ''}"></div>
        </div>
        <button class="primary-btn" id="saveEmpBtn" style="width:auto;padding:9px 18px;">${editing ? 'Сохранить изменения' : 'Добавить сотрудника'}</button>
        ${editing ? '<button class="row-actions" id="cancelEditBtn" style="margin-left:8px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:4px;padding:9px 14px;cursor:pointer;">Отмена</button>' : ''}
      </div>
      <div class="card">
        <h2>Список сотрудников</h2>
        <div class="emp-grid" id="empListGrid"></div>
      </div>
    `;
    main.appendChild(wrap);

    document.getElementById('saveEmpBtn').onclick = async () => {
      const fio = document.getElementById('fFio').value.trim();
      const position = document.getElementById('fPos').value.trim();
      const phone = document.getElementById('fPhone').value.trim();
      const notes = document.getElementById('fNote').value.trim();
      if (!fio || !phone) { showToast('Укажите ФИО и телефон'); return; }
      if (editing) { await Store.updateEmployee(editing.id, { fio, position, phone, notes }); editingEmpId = null; }
      else { await Store.addEmployee({ fio, position, phone, notes }); }
      showToast('Сохранено');
      renderAdmin();
    };
    const cancelBtn = document.getElementById('cancelEditBtn');
    if (cancelBtn) cancelBtn.onclick = () => { editingEmpId = null; renderAdmin(); };

    const listGrid = document.getElementById('empListGrid');
    if (!employees.length) { listGrid.innerHTML = '<p class="empty-line">Пока никого нет.</p>'; }
    else {
      listGrid.innerHTML = employees.map(e => `
        <div class="emp-card" data-view="${e.id}" style="cursor:default;">
          <div class="name">${escapeHtml(e.fio)}</div>
          <div class="role">${escapeHtml(e.position || 'без должности')}</div>
          <div class="role">${escapeHtml(e.phone || '')}</div>
          <div class="row-actions" style="margin-top:8px;">
            <button data-edit="${e.id}">Изменить</button>
            <button data-del="${e.id}">Удалить</button>
            <button data-open="${e.id}">Поручения</button>
          </div>
        </div>
      `).join('');
      listGrid.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editingEmpId = b.getAttribute('data-edit'); renderAdmin(); });
      listGrid.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { modalEmpId = b.getAttribute('data-open'); renderAdmin(); });
      listGrid.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
        const id = b.getAttribute('data-del');
        if (confirm('Удалить сотрудника? Его поручения останутся в списке.')) { await Store.deleteEmployee(id); renderAdmin(); }
      });
    }
  }

  // ---------- employee detail modal ----------
  function renderEmployeeModal() {
    const emp = employees.find(e => e.id === modalEmpId);
    if (!emp) { modalEmpId = null; return; }
    const own = tasks.filter(t => t.employeeId === emp.id).sort((a, b) => a.dueDate < b.dueDate ? 1 : -1);
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <div class="modal">
        <button class="modal-close" id="closeModal" aria-label="Закрыть">×</button>
        <h2>${escapeHtml(emp.fio)}</h2>
        <div class="modal-sub">${escapeHtml(emp.position || 'без должности')}</div>
        <div class="modal-phone">Телефон / WhatsApp: ${escapeHtml(emp.phone || '—')}</div>
        ${emp.notes ? `<div class="modal-phone">Заметка: ${escapeHtml(emp.notes)}</div>` : ''}
        <h3 style="margin-top:18px;font-size:0.92rem;">Поручения</h3>
        ${own.length ? `
          <table class="task-table">
            <thead><tr><th>Срок</th><th>Задание</th><th>Статус</th><th></th></tr></thead>
            <tbody>
              ${own.map(t => `
                <tr>
                  <td>${t.dueDate}</td>
                  <td>${escapeHtml(t.text)}</td>
                  <td><span class="status-pill ${t.status}">${t.status === 'done' ? 'выполнено' : 'в работе'}</span></td>
                  <td class="row-actions">
                    <button data-toggle="${t.id}">${t.status === 'done' ? 'вернуть в работу' : 'отметить выполненным'}</button>
                    <button data-deltask="${t.id}">удалить</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p class="empty-line">Поручений пока нет.</p>'}
      </div>
    `;
    document.body.appendChild(back);
    document.getElementById('closeModal').onclick = () => { modalEmpId = null; back.remove(); };
    back.addEventListener('click', (e) => { if (e.target === back) { modalEmpId = null; back.remove(); } });
    back.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
      const id = b.getAttribute('data-toggle');
      const t = tasks.find(x => x.id === id);
      await Store.updateTask(id, { status: t.status === 'done' ? 'active' : 'done' });
      back.remove(); modalEmpId = emp.id; renderAdmin();
    });
    back.querySelectorAll('[data-deltask]').forEach(b => b.onclick = async () => {
      const id = b.getAttribute('data-deltask');
      if (confirm('Удалить поручение?')) { await Store.deleteTask(id); back.remove(); modalEmpId = emp.id; renderAdmin(); }
    });
  }

  // ---------- EMPLOYEE SELF VIEW ----------
  function renderEmployeeSelf() {
    const emp = employees.find(e => e.id === session.employeeId);
    if (!emp) {
      root.innerHTML = `<div class="login-screen"><div class="login-box"><p>Карточка сотрудника не найдена.</p><button class="primary-btn" id="backBtn">Назад</button></div></div>`;
      document.getElementById('backBtn').onclick = logout;
      return;
    }
    const own = tasks.filter(t => t.employeeId === emp.id).sort((a, b) => a.dueDate < b.dueDate ? 1 : -1);
    const initials = surnameOf(emp.fio).slice(0, 2).toUpperCase();
    root.innerHTML = `
      <div class="shell">
        <aside class="sidebar">
          <div class="brand">Поручения</div>
          <nav><button class="active">Моя карточка</button></nav>
          <div class="who"><strong>${escapeHtml(emp.fio)}</strong>сотрудник</div>
          <button class="logout-btn" id="logoutBtn">Выйти</button>
        </aside>
        <main class="main">
          <div class="page-head"><h1>Моя карточка</h1><p>Только просмотр — изменения вносит руководитель.</p></div>
          <div class="card self-card">
            <div class="avatar-badge">${initials}</div>
            <div>
              <h2 style="font-size:1.1rem;">${escapeHtml(emp.fio)}</h2>
              <p style="color:var(--ink-soft);margin:4px 0 0;">${escapeHtml(emp.position || 'без должности')}</p>
              <p style="margin:8px 0 0;font-size:0.88rem;">Телефон / WhatsApp: ${escapeHtml(emp.phone || '—')}</p>
              ${emp.notes ? `<p style="margin:4px 0 0;font-size:0.88rem;color:var(--ink-soft);">${escapeHtml(emp.notes)}</p>` : ''}
            </div>
          </div>
          <div class="card">
            <h2>Мои поручения</h2>
            ${own.length ? `
              <table class="task-table">
                <thead><tr><th>Срок</th><th>Задание</th><th>Статус</th></tr></thead>
                <tbody>
                  ${own.map(t => `<tr><td>${t.dueDate}</td><td>${escapeHtml(t.text)}</td><td><span class="status-pill ${t.status}">${t.status === 'done' ? 'выполнено' : 'в работе'}</span></td></tr>`).join('')}
                </tbody>
              </table>
            ` : '<p class="empty-line">Поручений пока нет.</p>'}
          </div>
        </main>
      </div>
    `;
    document.getElementById('logoutBtn').onclick = logout;
  }

  // ---------- toast ----------
  let toastTimer = null;
  function showToast(msg) {
    let t = document.querySelector('.toast');
    if (t) t.remove();
    t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 2400);
  }

  init();
})();
</script>
</body>
</html>
