<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь заметок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAEEEC;
    --paper-raised: #F4F6F4;
    --ink: #1C2B27;
    --ink-soft: #52625D;
    --line: #C7D0CB;
    --accent: #A6702B;
    --accent-soft: #E6D3AE;
    --today: #5C3E93;
    --today-soft: #E3DAF2;
    --danger: #A6432D;
    --shadow: rgba(28, 43, 39, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16211D;
      --paper-raised: #1D2B25;
      --ink: #E7EDE9;
      --ink-soft: #9BAAA3;
      --line: #34443C;
      --accent: #D8A85C;
      --accent-soft: #4A3D22;
      --today: #B39BE0;
      --today-soft: #362A55;
      --danger: #E08267;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --paper: #16211D;
    --paper-raised: #1D2B25;
    --ink: #E7EDE9;
    --ink-soft: #9BAAA3;
    --line: #34443C;
    --accent: #D8A85C;
    --accent-soft: #4A3D22;
    --today: #B39BE0;
    --today-soft: #362A55;
    --danger: #E08267;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100vh;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .app {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .masthead h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .masthead p {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
    max-width: 40ch;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  }

  .calendar-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px;
    box-shadow: 0 1px 3px var(--shadow);
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .cal-nav .month-label {
    font-family: 'Source Serif 4', serif;
    font-size: 1.3rem;
    font-weight: 600;
    min-width: 200px;
    text-align: center;
  }

  .nav-btn, .today-btn {
    font-family: inherit;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 3px;
    width: 34px;
    height: 34px;
    font-size: 1.1rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .nav-btn:hover, .today-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn:focus-visible, .today-btn:focus-visible,
  .day-cell:focus-visible, .note-item:focus-visible,
  textarea:focus-visible, .save-btn:focus-visible, .delete-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .today-btn {
    width: auto;
    padding: 0 14px;
    font-size: 0.85rem;
  }

  .nav-cluster { display: flex; gap: 8px; align-items: center; }

  .weekday-row, .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .weekday-row {
    margin-bottom: 6px;
  }

  .weekday-row span {
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-transform: lowercase;
    padding-bottom: 4px;
  }

  .day-cell {
    position: relative;
    aspect-ratio: 1 / 0.82;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 0;
  }

  .day-cell:hover { background: var(--paper); border-color: var(--line); }

  .day-cell.is-weekend { color: var(--danger); }

  .day-cell.is-muted { color: var(--ink-soft); opacity: 0.4; cursor: default; }
  .day-cell.is-muted:hover { background: transparent; border-color: transparent; }

  .day-cell.is-today {
    background: var(--today-soft);
    font-weight: 600;
  }

  .day-cell.is-selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .day-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
  }

  .day-cell.has-note .day-dot { opacity: 1; }

  .side {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px;
    box-shadow: 0 1px 3px var(--shadow);
  }

  .panel-date {
    font-family: 'Source Serif 4', serif;
    font-size: 1.05rem;
    margin: 0 0 2px;
  }

  .panel-hint {
    color: var(--ink-soft);
    font-size: 0.82rem;
    margin: 0 0 12px;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.92rem;
    padding: 10px;
    line-height: 1.5;
  }

  .panel-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .save-status {
    font-size: 0.78rem;
    color: var(--ink-soft);
    min-height: 1em;
  }

  .btn-row { display: flex; gap: 8px; }

  .save-btn, .delete-btn {
    font-family: inherit;
    font-size: 0.82rem;
    border-radius: 3px;
    padding: 7px 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
  }

  .save-btn { border-color: var(--accent); color: var(--accent); }
  .save-btn:hover { background: var(--accent-soft); }
  .delete-btn:hover { border-color: var(--danger); color: var(--danger); }

  .notes-list h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 10px;
  }

  .notes-list ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: 260px;
    overflow-y: auto;
  }

  .note-item {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-radius: 3px;
    padding: 8px 8px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
  }

  .note-item:hover { background: var(--paper); }

  .note-item .ni-date {
    font-size: 0.75rem;
    color: var(--accent);
    display: block;
    margin-bottom: 2px;
  }

  .note-item .ni-text {
    font-size: 0.82rem;
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty-notes {
    color: var(--ink-soft);
    font-size: 0.82rem;
    margin: 0;
  }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div>
      <h1>Календарь заметок</h1>
      <p>Отметьте любую дату и запишите к ней всё, что нужно — событие, мысль, напоминание.</p>
    </div>
  </header>

  <div class="layout">
    <div class="calendar-card">
      <div class="cal-nav">
        <div class="nav-cluster">
          <button class="nav-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
          <button class="nav-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
        </div>
        <div class="month-label" id="monthLabel" aria-live="polite"></div>
        <button class="today-btn" id="gotoToday">Сегодня</button>
      </div>
      <div class="weekday-row">
        <span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span>
      </div>
      <div class="day-grid" id="dayGrid" role="grid" aria-label="Дни месяца"></div>
    </div>

    <div class="side">
      <div class="panel">
        <p class="panel-date" id="panelDate">Выберите дату</p>
        <p class="panel-hint" id="panelHint">Нажмите на любой день в календаре, чтобы добавить заметку.</p>
        <textarea id="noteText" placeholder="Заметка на этот день…" disabled></textarea>
        <div class="panel-actions">
          <span class="save-status" id="saveStatus"></span>
          <div class="btn-row">
            <button class="delete-btn" id="deleteNote" disabled>Удалить</button>
            <button class="save-btn" id="saveNote" disabled>Сохранить</button>
          </div>
        </div>
      </div>

      <div class="panel notes-list">
        <h2>Все заметки</h2>
        <ul id="notesList"></ul>
        <p class="empty-notes" id="emptyNotes">Заметок пока нет.</p>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'calendar-notes-v1';
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const weekdayFull = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];

  let notes = {};
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    notes = raw ? JSON.parse(raw) : {};
  } catch (e) {
    notes = {};
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    } catch (e) {
      const status = document.getElementById('saveStatus');
      status.textContent = 'Не удалось сохранить локально';
    }
  }

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let selectedKey = null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function keyOf(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }

  const monthLabel = document.getElementById('monthLabel');
  const dayGrid = document.getElementById('dayGrid');
  const noteText = document.getElementById('noteText');
  const panelDate = document.getElementById('panelDate');
  const panelHint = document.getElementById('panelHint');
  const saveBtn = document.getElementById('saveNote');
  const deleteBtn = document.getElementById('deleteNote');
  const saveStatus = document.getElementById('saveStatus');
  const notesListEl = document.getElementById('notesList');
  const emptyNotesEl = document.getElementById('emptyNotes');

  function renderCalendar() {
    monthLabel.textContent = `${monthNames[viewMonth]} ${viewYear}`;
    dayGrid.innerHTML = '';

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    let startOffset = firstOfMonth.getDay() - 1;
    if (startOffset < 0) startOffset = 6;

    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

    const cells = [];

    for (let i = 0; i < startOffset; i++) {
      cells.push({ day: daysInPrevMonth - startOffset + 1 + i, muted: true });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, muted: false });
    }
    const remainder = cells.length % 7;
    if (remainder !== 0) {
      const trailing = 7 - remainder;
      for (let d = 1; d <= trailing; d++) {
        cells.push({ day: d, muted: true, isNext: true });
      }
    }

    cells.forEach((cell, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day-cell';
      btn.setAttribute('role', 'gridcell');

      let cellYear = viewYear, cellMonth = viewMonth;
      if (cell.muted && idx < startOffset) {
        cellMonth = viewMonth - 1;
        if (cellMonth < 0) { cellMonth = 11; cellYear -= 1; }
      } else if (cell.muted && cell.isNext) {
        cellMonth = viewMonth + 1;
        if (cellMonth > 11) { cellMonth = 0; cellYear += 1; }
      }

      const dow = new Date(cellYear, cellMonth, cell.day).getDay();
      if (dow === 0 || dow === 6) btn.classList.add('is-weekend');
      if (cell.muted) btn.classList.add('is-muted');

      const k = keyOf(cellYear, cellMonth, cell.day);
      const isToday = k === keyOf(today.getFullYear(), today.getMonth(), today.getDate());
      if (isToday && !cell.muted) btn.classList.add('is-today');
      if (k === selectedKey && !cell.muted) btn.classList.add('is-selected');
      if (notes[k] && notes[k].trim()) btn.classList.add('has-note');

      btn.innerHTML = `<span>${cell.day}</span><span class="day-dot"></span>`;

      if (!cell.muted) {
        btn.addEventListener('click', () => selectDate(cellYear, cellMonth, cell.day));
      } else {
        btn.disabled = true;
      }

      dayGrid.appendChild(btn);
    });
  }

  function selectDate(y, m, d) {
    selectedKey = keyOf(y, m, d);
    const dateObj = new Date(y, m, d);
    const wd = weekdayFull[(dateObj.getDay() + 6) % 7];
    panelDate.textContent = `${d} ${monthNames[m].toLowerCase()} ${y}, ${wd}`;
    panelHint.textContent = 'Заметка сохраняется автоматически в этом браузере.';
    noteText.disabled = false;
    saveBtn.disabled = false;
    noteText.value = notes[selectedKey] || '';
    deleteBtn.disabled = !notes[selectedKey];
    saveStatus.textContent = '';
    if (y !== viewYear || m !== viewMonth) {
      viewYear = y; viewMonth = m;
    }
    renderCalendar();
    renderNotesList();
  }

  function saveCurrentNote() {
    if (!selectedKey) return;
    const val = noteText.value;
    if (val.trim()) {
      notes[selectedKey] = val;
    } else {
      delete notes[selectedKey];
    }
    persist();
    saveStatus.textContent = 'Сохранено';
    deleteBtn.disabled = !notes[selectedKey];
    renderCalendar();
    renderNotesList();
  }

  function deleteCurrentNote() {
    if (!selectedKey) return;
    delete notes[selectedKey];
    persist();
    noteText.value = '';
    deleteBtn.disabled = true;
    saveStatus.textContent = 'Удалено';
    renderCalendar();
    renderNotesList();
  }

  function renderNotesList() {
    const keys = Object.keys(notes).filter(k => notes[k] && notes[k].trim()).sort();
    notesListEl.innerHTML = '';
    emptyNotesEl.style.display = keys.length ? 'none' : 'block';

    keys.forEach(k => {
      const [y, m, d] = k.split('-').map(Number);
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'note-item';
      btn.innerHTML = `<span class="ni-date">${d} ${monthNames[m - 1].toLowerCase()} ${y}</span><span class="ni-text"></span>`;
      btn.querySelector('.ni-text').textContent = notes[k];
      btn.addEventListener('click', () => selectDate(y, m - 1, d));
      li.appendChild(btn);
      notesListEl.appendChild(li);
    });
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth -= 1;
    if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
    renderCalendar();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth += 1;
    if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
    renderCalendar();
  });

  document.getElementById('gotoToday').addEventListener('click', () => {
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    renderCalendar();
  });

  saveBtn.addEventListener('click', saveCurrentNote);
  deleteBtn.addEventListener('click', deleteCurrentNote);
  noteText.addEventListener('blur', () => { if (selectedKey) saveCurrentNote(); });

  renderCalendar();
  renderNotesList();
})();
</script>
</body>
</html>
